# Release: a tag builds the server for both platforms and attaches the archives to a GitHub release.
#
# Both builds are static and cross-compiled on Linux: the storage is pure-Go SQLite (modernc.org/sqlite),
# so no cgo, no MinGW and no dependency on a particular OS runner.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            goos: linux
            binary: web-search-mcp
          - platform: windows-amd64
            goos: windows
            binary: web-search-mcp.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and pack
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags "-s -w" -o "${{ matrix.binary }}" .
          zip="web-search-mcp_${tag}_${{ matrix.platform }}.zip"
          zip -q "$zip" "${{ matrix.binary }}" LICENSE README.md
          sha256sum "$zip" > "$zip.sha256"
          cat "$zip.sha256"
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256
